<aside class="sidebar" [class.collapsed]="collapsed">

    <div class="logo">
        <span class="logo-mark">A</span>
        <div class="logo-copy">
            <strong>Atlas</strong><span>Core</span>
            <small>Panel de gestión</small>
        </div>
    </div>

    <button
        mat-icon-button
        class="collapse-button"
        type="button"
        [attr.aria-label]="collapsed ? 'Expandir menú' : 'Plegar menú'"
        [attr.aria-expanded]="!collapsed"
        (click)="toggleCollapsed()">
        <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>

    <nav aria-label="Navegación principal">

        <p class="section-label">Menú principal</p>

        <mat-nav-list>

        @for(item of menuItems; track item.label){

            <a
                mat-list-item
                [routerLink]="item.route"
                routerLinkActive="active"
                #link="routerLinkActive"
                [attr.aria-current]="link.isActive ? 'page' : null">

                <mat-icon matListItemIcon>
                    {{item.icon}}
                </mat-icon>

                <span matListItemTitle class="nav-label">
                    {{item.label}}
                </span>

            </a>

        }

        </mat-nav-list>

    </nav>

    <div class="sidebar-footer">

        <div class="user-profile">
            <span class="avatar">JP</span>
            <div class="user-copy">
                <strong>Juan Pablo</strong>
                <small>Administrador</small>
            </div>
        </div>

        <button mat-button class="logout-button" type="button">

            <mat-icon>logout</mat-icon>

            <span class="logout-label">Cerrar sesión</span>

        </button>

        <button
            mat-button
            type="button"
            (click)="themeService.toggle()"
            [attr.aria-label]="themeService.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'">
            <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
            <span class="logout-label">{{ themeService.theme() === 'dark' ? 'Tema claro' : 'Tema oscuro' }}</span>
        </button>

    </div>

</aside>
